#cloud-config
# Disposable M0 VM only. No SSH credentials or production accounts.
hostname: gaoji-m0-ubuntu
ssh_pwauth: false
disable_root: true
package_update: true
packages:
  - docker.io
  - python3
  - e2fsprogs
write_files:
  - path: /etc/gaoji-m0-disposable
    permissions: '0444'
    content: |
      gaoji-m0
  - path: /etc/systemd/system/serial-getty@ttyAMA0.service.d/autologin.conf
    permissions: '0644'
    content: |
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud 115200,38400,9600 - $TERM
runcmd:
  - [systemctl, disable, --now, ssh.service, ssh.socket]
  - [systemctl, enable, --now, docker.service]
  - [systemctl, daemon-reload]
  - [systemctl, restart, serial-getty@ttyAMA0.service]
