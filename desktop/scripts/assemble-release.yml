name: Assemble verified installers
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: installer-assembly-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - name: Assemble and verify draft assets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const { pipeline } = require('node:stream/promises');
          const { GH_TOKEN: token, REPOSITORY: repo, RELEASE_TAG: tag, MANIFEST_SHA256: expected } = process.env;
          const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          async function api(route, method = 'GET') {
            const response = await fetch(`https://api.github.com/repos/${repo}${route}`, { method, headers, signal: AbortSignal.timeout(60000) });
            if (!response.ok) throw Error(`API ${method}: ${response.status}`);
            return response.status === 204 ? null : response.json();
          }
          async function main() {
            if (repo !== 'zty20040403/gaoji-app' || !/^app-v\d+\.\d+\.\d+$/.test(tag) || !/^[a-f0-9]{64}$/.test(expected)) throw Error('Invalid release input');
            const release = (await api('/releases?per_page=100')).find(item => item.tag_name === tag);
            if (!release?.draft) throw Error('Only unpublished drafts may be assembled');
            const assets = await api(`/releases/${release.id}/assets?per_page=100`);
            async function download(name) {
              const asset = assets.find(item => item.name === name && item.state === 'uploaded');
              if (!asset) throw Error(`Missing asset: ${name}`);
              const response = await fetch(`https://api.github.com/repos/${repo}/releases/assets/${asset.id}`, {
                headers: { ...headers, Accept: 'application/octet-stream' }, signal: AbortSignal.timeout(300000) });
              if (!response.ok) throw Error(`Download ${name}: ${response.status}`);
              return response;
            }
            const raw = Buffer.from(await (await download('release.json')).arrayBuffer());
            if (createHash('sha256').update(raw).digest('hex') !== expected) throw Error('Manifest hash mismatch');
            const manifest = JSON.parse(raw);
            const version = tag.slice(5);
            const names = [`Gaoji-${version}-arm64.dmg`, `Gaoji-${version}-arm64-mac.zip`, `Gaoji-Setup-${version}.exe`, `Gaoji-${version}-win.zip`];
            if (manifest.version !== version || manifest.files.length !== names.length || new Set(manifest.files.map(item => item.name)).size !== names.length) throw Error('Invalid manifest');
            const chunkSize = 8 * 1024 ** 2;
            for (const file of manifest.files) {
              if (!names.includes(file.name) || !Number.isSafeInteger(file.bytes) || file.bytes < 1 || file.bytes > 1024 ** 3 || !/^[a-f0-9]{64}$/.test(file.sha256)) throw Error('Invalid installer');
              const existing = assets.find(item => item.name === file.name);
              if (existing?.state === 'uploaded' && existing.size === file.bytes && existing.digest === `sha256:${file.sha256}`) continue;
              if (existing && existing.state !== 'starter') throw Error('Conflicting installer');
              const output = fs.openSync(file.name, 'w');
              const hash = createHash('sha256');
              let size = 0;
              try {
                for (let index = 0; index < Math.ceil(file.bytes / chunkSize); index++) {
                  const part = `${file.name}.part-${String(index).padStart(3, '0')}`;
                  const response = await download(part);
                  let partSize = 0;
                  for await (const chunk of response.body) {
                    partSize += chunk.length; size += chunk.length;
                    if (partSize > Math.min(chunkSize, file.bytes - index * chunkSize)) throw Error('Oversized part');
                    hash.update(chunk);
                    const buffer = Buffer.from(chunk);
                    let written = 0;
                    while (written < buffer.length) written += fs.writeSync(output, buffer, written, buffer.length - written);
                  }
                  if (partSize !== Math.min(chunkSize, file.bytes - index * chunkSize)) throw Error('Truncated part');
                }
              } finally { fs.closeSync(output); }
              if (size !== file.bytes || hash.digest('hex') !== file.sha256) throw Error('Reassembled installer hash mismatch');
              if (existing) await api(`/releases/assets/${existing.id}`, 'DELETE');
              const response = await fetch(`https://uploads.github.com/repos/${repo}/releases/${release.id}/assets?name=${encodeURIComponent(file.name)}`, {
                method: 'POST', headers: { ...headers, 'Content-Type': 'application/octet-stream', 'Content-Length': String(file.bytes) },
                body: fs.createReadStream(file.name), duplex: 'half', signal: AbortSignal.timeout(600000) });
              if (!response.ok) throw Error(`Upload ${file.name}: ${response.status}`);
              const uploaded = await response.json();
              if (uploaded.state !== 'uploaded' || uploaded.size !== file.bytes || uploaded.digest !== `sha256:${file.sha256}`) throw Error('Uploaded installer hash mismatch');
              fs.unlinkSync(file.name);
              console.log(`Verified: ${file.name}`);
            }
            // Keep the release private until the local publisher verifies all final assets.
            for (const asset of assets) {
              if (names.some(name => asset.name.startsWith(name + '.part-'))) await api(`/releases/assets/${asset.id}`, 'DELETE');
            }
            console.log('All installers verified; temporary parts removed. Draft ready for publication.');
          }
          main().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
