    <text x="72" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="42" fill="#EEF2F7" font-weight="600" letter-spacing="1">聊天像朋友，</text>
    <text x="72" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="42" fill="url(#gold)" font-weight="600" letter-spacing="1">干活像 agent。</text>
    <text x="72" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18" fill="#8E98A8">记忆、工具和沙箱里的后台 agent，都在你的群聊里。</text>
