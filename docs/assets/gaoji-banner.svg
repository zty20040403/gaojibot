    <text x="64" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="124" fill="url(#silver)" font-weight="700" letter-spacing="-6">gaoji</text>
