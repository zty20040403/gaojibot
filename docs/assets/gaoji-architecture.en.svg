<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">gaoji architecture</title>
  <desc id="d">Official QQ messages reach the foreground agent, which talks to multiple models and replies through a durable outbox. Long tasks become durable background jobs that run a coding agent inside the conversation's own container. PostgreSQL stores the ledger.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A0D12"/><stop offset="1" stop-color="#040507"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A5F3FC"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#A5F3FC"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#11151C"/><stop offset="1" stop-color="#0B0E13"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8" stop-opacity=".55"/><stop offset=".35" stop-color="#38BDF8" stop-opacity=".12"/><stop offset="1" stop-color="#EEF2F7" stop-opacity=".05"/></linearGradient>
    <linearGradient id="edgeq" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EEF2F7" stop-opacity=".16"/><stop offset=".4" stop-color="#EEF2F7" stop-opacity=".05"/><stop offset="1" stop-color="#EEF2F7" stop-opacity=".03"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EEF2F7" stop-opacity="0"/><stop offset=".5" stop-color="#EEF2F7" stop-opacity=".22"/><stop offset="1" stop-color="#EEF2F7" stop-opacity="0"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8" stop-opacity=".5"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop stop-color="#6366F1" stop-opacity=".16"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <radialGradient id="jglow" cx=".5" cy=".5" r=".5"><stop stop-color="#34D399" stop-opacity=".10"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E2533"/><stop offset="1" stop-color="#0D1220"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#EEF2F7" stroke-opacity=".045"/></pattern>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#8B95A5"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A5F3FC" stop-opacity="0"/><stop offset=".5" stop-color="#A5F3FC"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></linearGradient>
    <radialGradient id="spot" cx=".5" cy="0" r="1"><stop stop-color="#3B82F6" stop-opacity=".22"/><stop offset=".45" stop-color="#3B82F6" stop-opacity=".05"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <linearGradient id="floorfade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
    <mask id="floormask"><rect width="100%" height="100%" fill="url(#floorfade)"/></mask>
    <filter id="neon" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2000" height="1200"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".6"/><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38BDF8"/></marker>
    <clipPath id="frame"><rect width="1280" height="640" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="640" fill="url(#bg)"/>
    <rect width="1280" height="640" fill="url(#dots)"/>
    <rect width="1280" height="640" fill="url(#spot)"/>
    <ellipse cx="640" cy="340" rx="540" ry="270" fill="url(#glow)"/>
    <text x="56" y="66" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#38BDF8" font-weight="500" letter-spacing="2.2">// ARCHITECTURE</text>
    <text x="56" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="30" fill="#EEF2F7" font-weight="600" letter-spacing="-0.6">The front chats. The back works. The boundary holds.</text>
    <g filter="url(#lift)"><rect x="56" y="146" width="300" height="140" rx="16" fill="url(#face)"/></g>
    <rect x="56.5" y="146.5" width="299" height="139" rx="15.5" fill="none" stroke="url(#edgeq)"/>
    <rect x="72" y="146.5" width="268" height="1" fill="url(#sheen)"/>
    <rect x="78" y="168" width="36" height="36" rx="9.0" fill="url(#iconbg)" stroke="#38BDF8" stroke-opacity=".45"/>
    <g transform="translate(84.84 174.84) scale(0.9300)" fill="none" stroke="#A5F3FC" stroke-width="1.07" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5z"/><path d="M8.5 9.5h7M8.5 12.5h4.5"/></g>
    <text x="126" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18.5" fill="#EEF2F7" font-weight="600">Official QQ</text>
    <text x="80" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13.5" fill="#8E98A8">Groups and private chats</text>
    <text x="80" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13.5" fill="#8E98A8">Durable outbox, real receipts</text>
    <g filter="url(#lift)"><rect x="470" y="146" width="340" height="140" rx="16" fill="url(#face)"/></g>
    <rect x="470.5" y="146.5" width="339" height="139" rx="15.5" fill="none" stroke="url(#edge)"/>
    <rect x="486" y="146.5" width="308" height="1" fill="url(#sheen)"/>
    <rect x="492" y="168" width="36" height="36" rx="9.0" fill="url(#iconbg)" stroke="#38BDF8" stroke-opacity=".45"/>
    <g transform="translate(498.84 174.84) scale(0.9300)" fill="none" stroke="#A5F3FC" stroke-width="1.07" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.9 5.6 5.6 1.9-5.6 1.9L12 18.5l-1.9-5.6L4.5 11l5.6-1.9z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></g>
    <text x="540" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18.5" fill="#A5F3FC" font-weight="600">Foreground agent</text>
    <text x="494" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13.5" fill="#8E98A8">Persona, memory, tools</text>
    <text x="494" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13.5" fill="#8E98A8">Decides when to speak</text>
    <g filter="url(#lift)"><rect x="924" y="146" width="300" height="140" rx="16" fill="url(#face)"/></g>
    <rect x="924.5" y="146.5" width="299" height="139" rx="15.5" fill="none" stroke="url(#edgeq)"/>
    <rect x="940" y="146.5" width="268" height="1" fill="url(#sheen)"/>
    <rect x="946" y="168" width="36" height="36" rx="9.0" fill="url(#iconbg)" stroke="#38BDF8" stroke-opacity=".45"/>
    <g transform="translate(952.84 174.84) scale(0.9300)" fill="none" stroke="#A5F3FC" stroke-width="1.07" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8z"/><path d="M3.5 12.5l8.5 4.5 8.5-4.5M3.5 16.5L12 21l8.5-4.5"/></g>
    <text x="994" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18.5" fill="#EEF2F7" font-weight="600">Model providers</text>
    <text x="948" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13.5" fill="#8E98A8">Multiple models per chat</text>
    <text x="948" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13.5" fill="#8E98A8">Host-side keys only</text>
    <g filter="url(#lift)"><rect x="56" y="392" width="300" height="140" rx="16" fill="url(#face)"/></g>
    <rect x="56.5" y="392.5" width="299" height="139" rx="15.5" fill="none" stroke="url(#edgeq)"/>
    <rect x="72" y="392.5" width="268" height="1" fill="url(#sheen)"/>
    <rect x="78" y="414" width="36" height="36" rx="9.0" fill="url(#iconbg)" stroke="#38BDF8" stroke-opacity=".45"/>
    <g transform="translate(84.84 420.84) scale(0.9300)" fill="none" stroke="#A5F3FC" stroke-width="1.07" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.5" ry="2.8"/><path d="M4.5 6v12c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8V6M4.5 12c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8"/></g>
    <text x="126" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18.5" fill="#EEF2F7" font-weight="600">PostgreSQL</text>
    <text x="80" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13.5" fill="#8E98A8">Message ledger, memory</text>
    <text x="80" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13.5" fill="#8E98A8">Jobs, schedules, receipts</text>
    <g filter="url(#lift)"><rect x="470" y="392" width="340" height="140" rx="16" fill="url(#face)"/></g>
    <rect x="470.5" y="392.5" width="339" height="139" rx="15.5" fill="none" stroke="url(#edgeq)"/>
    <rect x="486" y="392.5" width="308" height="1" fill="url(#sheen)"/>
    <rect x="492" y="414" width="36" height="36" rx="9.0" fill="url(#iconbg)" stroke="#38BDF8" stroke-opacity=".45"/>
    <g transform="translate(498.84 420.84) scale(0.9300)" fill="none" stroke="#A5F3FC" stroke-width="1.07" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="5" cy="6.5" r="1.3"/><circle cx="5" cy="12" r="1.3"/><circle cx="5" cy="17.5" r="1.3"/></g>
    <text x="540" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18.5" fill="#EEF2F7" font-weight="600">Background jobs</text>
    <text x="494" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13.5" fill="#8E98A8">Durable, steerable, cancellable</text>
    <text x="494" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13.5" fill="#8E98A8">Report back to the foreground</text>
    <g filter="url(#lift)"><rect x="924" y="392" width="300" height="140" rx="16" fill="url(#face)"/></g>
    <rect x="924.5" y="392.5" width="299" height="139" rx="15.5" fill="none" stroke="url(#edge)" stroke-dasharray="5 5"/>
    <rect x="940" y="392.5" width="268" height="1" fill="url(#sheen)"/>
    <rect x="946" y="414" width="36" height="36" rx="9.0" fill="url(#iconbg)" stroke="#38BDF8" stroke-opacity=".45"/>
    <g transform="translate(952.84 420.84) scale(0.9300)" fill="none" stroke="#A5F3FC" stroke-width="1.07" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g>
    <text x="994" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="18.5" fill="#A5F3FC" font-weight="600">Per-chat container</text>
    <text x="948" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13.5" fill="#8E98A8">Persistent /work workspace</text>
    <text x="948" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13.5" fill="#8E98A8">No host keys, no LAN access</text>
    <path d="M360 196 L466 196" stroke="#38BDF8" stroke-opacity=".9" stroke-width="1.6" fill="none" marker-end="url(#ah)" filter="url(#neon)"/>
    <rect x="385" y="172" width="55" height="20" rx="10" fill="#070A0F" stroke="#38BDF8" stroke-opacity=".3"/>
    <text x="413" y="186.5" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#38BDF8" text-anchor="middle">events</text>
    <path d="M466 240 L360 240" stroke="#38BDF8" stroke-opacity=".9" stroke-width="1.6" fill="none" marker-end="url(#ah)" filter="url(#neon)"/>
    <rect x="385" y="250" width="56" height="20" rx="10" fill="#070A0F" stroke="#38BDF8" stroke-opacity=".3"/>
    <text x="413" y="264.5" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#38BDF8" text-anchor="middle">replies</text>
    <path d="M814 216 L920 216" stroke="#38BDF8" stroke-opacity=".9" stroke-width="1.6" fill="none" marker-end="url(#ah)" marker-start="url(#ah)" filter="url(#neon)"/>
    <rect x="827" y="192" width="80" height="20" rx="10" fill="#070A0F" stroke="#38BDF8" stroke-opacity=".3"/>
    <text x="867" y="206.5" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#38BDF8" text-anchor="middle">model calls</text>
    <path d="M640 290 L640 388" stroke="#38BDF8" stroke-opacity=".9" stroke-width="1.6" fill="none" marker-end="url(#ah)" marker-start="url(#ah)" filter="url(#neon)"/>
    <rect x="582" y="330" width="115" height="20" rx="10" fill="#070A0F" stroke="#38BDF8" stroke-opacity=".3"/>
    <text x="640" y="344.5" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#38BDF8" text-anchor="middle">delegate / report</text>
    <path d="M814 462 L920 462" stroke="#38BDF8" stroke-opacity=".9" stroke-width="1.6" fill="none" marker-end="url(#ah)" marker-start="url(#ah)" filter="url(#neon)"/>
    <rect x="828" y="438" width="78" height="20" rx="10" fill="#070A0F" stroke="#38BDF8" stroke-opacity=".3"/>
