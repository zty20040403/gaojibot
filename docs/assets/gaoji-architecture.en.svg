    <path d="M360 462 L466 462" stroke="#8E98A8" stroke-opacity=".9" stroke-width="1.6" fill="none" stroke-dasharray="5 6" marker-end="url(#ah)" marker-start="url(#ah)"/>
    <rect x="393" y="438" width="39" height="20" rx="10" fill="#070A0F" stroke="#38BDF8" stroke-opacity=".3"/>
    <text x="413" y="452.5" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#38BDF8" text-anchor="middle">jobs</text>
    <path d="M206 290 L206 388" stroke="#8E98A8" stroke-opacity=".9" stroke-width="1.6" fill="none" stroke-dasharray="5 6" marker-end="url(#ah)" marker-start="url(#ah)"/>
    <rect x="180" y="330" width="52" height="20" rx="10" fill="#070A0F" stroke="#38BDF8" stroke-opacity=".3"/>
    <text x="206" y="344.5" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#38BDF8" text-anchor="middle">ledger</text>
    <rect x="56" y="572" width="1168" height="1" fill="url(#hair)"/>
    <circle cx="60" cy="602" r="3" fill="#34D399"/>
    <text x="72" y="607" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13" fill="#8E98A8" font-weight="500" letter-spacing="0.4">Keys stay on the host</text>
    <circle cx="267.4285714285714" cy="602" r="3" fill="#34D399"/>
    <text x="279.429" y="607" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13" fill="#8E98A8" font-weight="500" letter-spacing="0.4">Sandbox can't reach your network</text>
    <circle cx="553.042857142857" cy="602" r="3" fill="#34D399"/>
    <text x="565.043" y="607" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="13" fill="#8E98A8" font-weight="500" letter-spacing="0.4">Generated ≠ delivered</text>
