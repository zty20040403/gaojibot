<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Gaoji 的对话与执行架构</title>
  <desc id="desc">前台通过多模型 API 聊天和调用工具，经 Outbox 交付。复杂任务落库，由宿主驱动隔离 VM 中的 Codex；VM 请求经宿主中转，报告回前台。PostgreSQL 保存持久状态，凭据不进入 VM。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1222"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="#67e8f9"/></marker>
    <marker id="purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="#a78bfa"/></marker>
    <marker id="orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="#fbbf24"/></marker>
  </defs>
  <rect x="1" y="1" width="1278" height="518" rx="20" fill="url(#bg)" stroke="#25344e"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="43" fill="#8ca3c6" font-size="11" letter-spacing="2.2">THE SYSTEM, AT A GLANCE</text>
    <text x="40" y="77" fill="#e2e8f0" font-size="24" font-weight="650">对话留在前台，执行交给后台。</text>
    <text x="1240" y="73" fill="#8ca3c6" font-size="13" text-anchor="end">逻辑架构 · 非实时监控</text>
    <g fill="#131f34" stroke="#33445f">
      <rect x="42" y="119" width="190" height="91" rx="13"/>
      <rect x="306" y="119" width="270" height="91" rx="13"/>
      <rect x="681" y="119" width="280" height="91" rx="13"/>
      <rect x="1048" y="119" width="190" height="91" rx="13"/>
      <rect x="42" y="320" width="190" height="114" rx="13"/>
      <rect x="306" y="320" width="270" height="114" rx="13"/>
      <rect x="1048" y="320" width="190" height="114" rx="13"/>
    </g>
    <rect x="651" y="307" width="322" height="140" rx="15" fill="#1b1732" stroke="#a78bfa" stroke-opacity=".7" stroke-dasharray="5 4"/>
    <g font-size="21" font-weight="650" fill="#f1f5f9">
      <text x="64" y="157">官方 QQ</text>
      <text x="329" y="157">前台 Agent</text>
      <text x="705" y="157">多模型 API</text>
      <text x="1070" y="157">Outbox</text>
      <text x="64" y="359" font-size="19">PostgreSQL</text>
      <text x="329" y="359">后台 Job / Worker</text>
      <text x="675" y="346" fill="#ddd6fe">Codex · 隔离 VM</text>
      <text x="1070" y="359" font-size="20">宿主中转</text>
    </g>
    <g font-size="14" fill="#98abc9">
      <text x="64" y="186">群聊 / 私聊 / 入站</text>
      <text x="329" y="186">时间线 · 记忆 · 工具 · 人设</text>
      <text x="705" y="186">前台网关 / 后台 Responses</text>
      <text x="1070" y="186">文字 / 文件 / 回执</text>
      <text x="64" y="385">聊天 / 记忆 / 任务</text>
      <text x="64" y="410">授权 / 请求 / 回执</text>
      <text x="329" y="385">持久队列 · 插话 / 取消</text>
      <text x="329" y="410">宿主驱动执行 · 报告回前台</text>
      <text x="675" y="377" fill="#c4b5fd">持久 /work · 代码 / 文件</text>
      <text x="675" y="404" fill="#a5a3c6">浏览器 / PDF / 视频 / 影音</text>
      <text x="675" y="428" fill="#9690b7" font-size="12">不持有宿主 Key · 不直接发 QQ</text>
      <text x="1070" y="385">任务 Token / RPC</text>
      <text x="1070" y="410">模型 Key 留在宿主</text>
    </g>
    <g fill="none" stroke-width="2" stroke-linejoin="round">
      <path d="M232 157H306" stroke="#67e8f9" marker-end="url(#blue)"/>
      <path d="M576 157H681" stroke="#fbbf24" marker-start="url(#orange)" marker-end="url(#orange)"/>
      <path d="M576 194H612V240H1143V210" stroke="#67e8f9" marker-end="url(#blue)"/>
      <path d="M434 210V320" stroke="#a78bfa" marker-start="url(#purple)" marker-end="url(#purple)"/>
      <path d="M576 372H651" stroke="#a78bfa" marker-start="url(#purple)" marker-end="url(#purple)"/>
      <path d="M973 372H1048" stroke="#a78bfa" marker-start="url(#purple)" marker-end="url(#purple)"/>
      <path d="M1143 320V281H821V210" stroke="#fbbf24" marker-start="url(#orange)" marker-end="url(#orange)"/>
      <path d="M306 186H269V275H137V320M232 390H306" stroke="#647c9e" stroke-dasharray="5 5"/>
    </g>
    <g font-size="12">
      <text x="627" y="139" fill="#fbbf24" text-anchor="middle">模型调用</text>
      <text x="828" y="231" fill="#67e8f9" text-anchor="middle">前台统一交付 → 官方消息 API</text>
      <text x="450" y="281" fill="#c4b5fd">委派 / 报告</text>
      <text x="616" y="357" fill="#c4b5fd" text-anchor="middle">执行</text>
      <text x="1011" y="357" fill="#c4b5fd" text-anchor="middle">请求</text>
      <text x="1102" y="301" fill="#fbbf24" text-anchor="end">模型请求 / 宿主认证</text>
      <text x="253" y="309" fill="#8ca3c6" text-anchor="end">持久状态</text>
    </g>
    <path d="M42 472H1238" stroke="url(#line)" stroke-opacity=".22"/>
    <g font-size="11" letter-spacing="1.6" fill="#93a9c9">
      <text x="42" y="498">HOST-ONLY KEYS</text>
      <text x="376" y="498">PERSISTENT WORKSPACE</text>
      <text x="810" y="498">DURABLE STATE</text>
      <text x="1238" y="498" text-anchor="end">HUMAN-FIRST DELIVERY</text>
    </g>
  </g>
</svg>
