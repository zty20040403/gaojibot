<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="616" viewBox="0 0 1280 616" role="img" aria-labelledby="t d">
  <title id="t">gaoji highlights</title>
  <desc id="d">Six highlights: knows when to speak; remembers; does real work in a sandbox; sees, hears and draws; runs on a schedule; safe by design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A0D12"/><stop offset="1" stop-color="#040507"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A5F3FC"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#A5F3FC"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#11151C"/><stop offset="1" stop-color="#0B0E13"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8" stop-opacity=".55"/><stop offset=".35" stop-color="#38BDF8" stop-opacity=".12"/><stop offset="1" stop-color="#EEF2F7" stop-opacity=".05"/></linearGradient>
    <linearGradient id="edgeq" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EEF2F7" stop-opacity=".16"/><stop offset=".4" stop-color="#EEF2F7" stop-opacity=".05"/><stop offset="1" stop-color="#EEF2F7" stop-opacity=".03"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EEF2F7" stop-opacity="0"/><stop offset=".5" stop-color="#EEF2F7" stop-opacity=".22"/><stop offset="1" stop-color="#EEF2F7" stop-opacity="0"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8" stop-opacity=".5"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop stop-color="#6366F1" stop-opacity=".16"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <radialGradient id="jglow" cx=".5" cy=".5" r=".5"><stop stop-color="#34D399" stop-opacity=".10"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E2533"/><stop offset="1" stop-color="#0D1220"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#EEF2F7" stroke-opacity=".045"/></pattern>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#8B95A5"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A5F3FC" stop-opacity="0"/><stop offset=".5" stop-color="#A5F3FC"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></linearGradient>
    <radialGradient id="spot" cx=".5" cy="0" r="1"><stop stop-color="#3B82F6" stop-opacity=".22"/><stop offset=".45" stop-color="#3B82F6" stop-opacity=".05"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <linearGradient id="floorfade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
    <mask id="floormask"><rect width="100%" height="100%" fill="url(#floorfade)"/></mask>
    <filter id="neon" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2000" height="1200"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".6"/><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38BDF8"/></marker>
    <clipPath id="frame"><rect width="1280" height="616" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="616" fill="url(#bg)"/>
    <rect width="1280" height="616" fill="url(#dots)"/>
    <rect width="1280" height="616" fill="url(#spot)"/>
    <ellipse cx="640" cy="10" rx="560" ry="210" fill="url(#glow)"/>
    <text x="56" y="66" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#38BDF8" font-weight="500" letter-spacing="2.2">// CAPABILITIES</text>
    <text x="56" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="30" fill="#EEF2F7" font-weight="600" letter-spacing="-0.6">A group member that actually gets things done</text>
    <g filter="url(#lift)"><rect x="56.0" y="140" width="373.3333333333333" height="196" rx="16" fill="url(#face)"/></g>
    <rect x="56.5" y="140.5" width="372.3333333333333" height="195" rx="15.5" fill="none" stroke="url(#edge)"/>
    <rect x="72.0" y="140.5" width="341.3333333333333" height="1" fill="url(#sheen)"/>
    <rect x="83.0" y="171" width="38" height="38" rx="9.5" fill="url(#iconbg)" stroke="#38BDF8" stroke-opacity=".45"/>
    <g transform="translate(90.22 178.22) scale(0.9817)" fill="none" stroke="#A5F3FC" stroke-width="1.01" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5z"/><path d="M8.5 9.5h7M8.5 12.5h4.5"/></g>
    <text x="405.333" y="180" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#38BDF8" font-weight="500" text-anchor="end" letter-spacing="1" fill-opacity="0.7">// 01</text>
    <text x="82" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="20" fill="#EEF2F7" font-weight="600">Knows when to speak</text>
    <text x="82" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="14.5" fill="#8E98A8">Always answers @-mentions and DMs.</text>
    <text x="82" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="14.5" fill="#8E98A8">Stays quiet when it has nothing to add.</text>
    <g filter="url(#lift)"><rect x="453.3333333333333" y="140" width="373.3333333333333" height="196" rx="16" fill="url(#face)"/></g>
    <rect x="453.8333333333333" y="140.5" width="372.3333333333333" height="195" rx="15.5" fill="none" stroke="url(#edgeq)"/>
    <rect x="469.3333333333333" y="140.5" width="341.3333333333333" height="1" fill="url(#sheen)"/>
    <rect x="480.3333333333333" y="171" width="38" height="38" rx="9.5" fill="url(#iconbg)" stroke="#38BDF8" stroke-opacity=".45"/>
    <g transform="translate(487.55 178.22) scale(0.9817)" fill="none" stroke="#A5F3FC" stroke-width="1.01" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h10A1.5 1.5 0 0 1 18.5 5v15.5L12 17l-6.5 3.5V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M9.5 8.5h5"/></g>
    <text x="802.667" y="180" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#38BDF8" font-weight="500" text-anchor="end" letter-spacing="1" fill-opacity="0.7">// 02</text>
    <text x="479.333" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="20" fill="#EEF2F7" font-weight="600">Remembers</text>
    <text x="479.333" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="14.5" fill="#8E98A8">Per-chat memory, full history search,</text>
    <text x="479.333" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="14.5" fill="#8E98A8">and a card for each regular in the group.</text>
    <g filter="url(#lift)"><rect x="850.6666666666666" y="140" width="373.3333333333333" height="196" rx="16" fill="url(#face)"/></g>
    <rect x="851.1666666666666" y="140.5" width="372.3333333333333" height="195" rx="15.5" fill="none" stroke="url(#edge)"/>
    <rect x="866.6666666666666" y="140.5" width="341.3333333333333" height="1" fill="url(#sheen)"/>
    <rect x="877.6666666666666" y="171" width="38" height="38" rx="9.5" fill="url(#iconbg)" stroke="#38BDF8" stroke-opacity=".45"/>
    <g transform="translate(884.89 178.22) scale(0.9817)" fill="none" stroke="#A5F3FC" stroke-width="1.01" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 10l3 2.25L7 14.5M12.5 15h4.5"/></g>
    <text x="1200" y="180" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#38BDF8" font-weight="500" text-anchor="end" letter-spacing="1" fill-opacity="0.7">// 03</text>
    <text x="876.667" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="20" fill="#EEF2F7" font-weight="600">Does real work</text>
    <text x="876.667" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="14.5" fill="#8E98A8">Research, code, files and video run in</text>
    <text x="876.667" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="14.5" fill="#8E98A8">the chat's own sandboxed container.</text>
    <g filter="url(#lift)"><rect x="56.0" y="360" width="373.3333333333333" height="196" rx="16" fill="url(#face)"/></g>
    <rect x="56.5" y="360.5" width="372.3333333333333" height="195" rx="15.5" fill="none" stroke="url(#edgeq)"/>
    <rect x="72.0" y="360.5" width="341.3333333333333" height="1" fill="url(#sheen)"/>
    <rect x="83.0" y="391" width="38" height="38" rx="9.5" fill="url(#iconbg)" stroke="#38BDF8" stroke-opacity=".45"/>
    <g transform="translate(90.22 398.22) scale(0.9817)" fill="none" stroke="#A5F3FC" stroke-width="1.01" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g>
    <text x="405.333" y="400" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#38BDF8" font-weight="500" text-anchor="end" letter-spacing="1" fill-opacity="0.7">// 04</text>
    <text x="82" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="20" fill="#EEF2F7" font-weight="600">Sees, hears, draws</text>
    <text x="82" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="14.5" fill="#8E98A8">Reads images and video, transcribes</text>
    <text x="82" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="14.5" fill="#8E98A8">voice, generates images, sends stickers.</text>
    <g filter="url(#lift)"><rect x="453.3333333333333" y="360" width="373.3333333333333" height="196" rx="16" fill="url(#face)"/></g>
    <rect x="453.8333333333333" y="360.5" width="372.3333333333333" height="195" rx="15.5" fill="none" stroke="url(#edgeq)"/>
    <rect x="469.3333333333333" y="360.5" width="341.3333333333333" height="1" fill="url(#sheen)"/>
    <rect x="480.3333333333333" y="391" width="38" height="38" rx="9.5" fill="url(#iconbg)" stroke="#38BDF8" stroke-opacity=".45"/>
    <g transform="translate(487.55 398.22) scale(0.9817)" fill="none" stroke="#A5F3FC" stroke-width="1.01" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g>
    <text x="802.667" y="400" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#38BDF8" font-weight="500" text-anchor="end" letter-spacing="1" fill-opacity="0.7">// 05</text>
    <text x="479.333" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="20" fill="#EEF2F7" font-weight="600">Runs on a schedule</text>
    <text x="479.333" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="14.5" fill="#8E98A8">Reminders, recurring tasks and</text>
    <text x="479.333" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="14.5" fill="#8E98A8">follow-ups it promised to come back to.</text>
    <g filter="url(#lift)"><rect x="850.6666666666666" y="360" width="373.3333333333333" height="196" rx="16" fill="url(#face)"/></g>
    <rect x="851.1666666666666" y="360.5" width="372.3333333333333" height="195" rx="15.5" fill="none" stroke="url(#edge)"/>
    <rect x="866.6666666666666" y="360.5" width="341.3333333333333" height="1" fill="url(#sheen)"/>
    <rect x="877.6666666666666" y="391" width="38" height="38" rx="9.5" fill="url(#iconbg)" stroke="#38BDF8" stroke-opacity=".45"/>
    <g transform="translate(884.89 398.22) scale(0.9817)" fill="none" stroke="#A5F3FC" stroke-width="1.01" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v6c0 4.8-3.3 7.9-7.5 9-4.2-1.1-7.5-4.2-7.5-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></g>
    <text x="1200" y="400" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#38BDF8" font-weight="500" text-anchor="end" letter-spacing="1" fill-opacity="0.7">// 06</text>
    <text x="876.667" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="20" fill="#EEF2F7" font-weight="600">Safe by design</text>
    <text x="876.667" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="14.5" fill="#8E98A8">Keys never leave the host; the sandbox</text>
    <text x="876.667" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif" font-size="14.5" fill="#8E98A8">can't reach your LAN. Owners decide.</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="615" rx="23.5" fill="none" stroke="#1E2530"/>
</svg>
