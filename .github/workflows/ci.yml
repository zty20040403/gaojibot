name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: qq_bot
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: qq_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qq_bot -d qq_bot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AI_POSTGRES_DSN: postgresql://qq_bot:ci-password@127.0.0.1:5432/qq_bot
      AI_POSTGRES_SCHEMA: qq_bot_test
      TEST_POSTGRES_DSN: postgresql://qq_bot:ci-password@127.0.0.1:5432/gaoji_acceptance
      TEST_POSTGRES_SCHEMA: qq_bot_test
      TEST_FILE_ACCEPTANCE_DSN: postgresql://qq_bot:ci-password@127.0.0.1:5432/gaoji_acceptance
      TEST_OPS_POSTGRES_DSN: postgresql://qq_bot:ci-password@127.0.0.1:5432/gaoji_acceptance
      TEST_SECURITY_POSTGRES_DSN: postgresql://qq_bot:ci-password@127.0.0.1:5432/gaoji_acceptance
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Isolate runtime state
        run: echo "AI_STATE_DIR=$RUNNER_TEMP/gaoji-ci-state" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies and development tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.21
          uv sync --locked --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Check requirements export matches the lockfile
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --output-file "$RUNNER_TEMP/requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/requirements.txt"
      - name: Check Python correctness
        run: ruff check bot.py src tests tools migrations nix
      - name: Compile all Python modules
        run: python -m compileall -q bot.py src migrations tests
      - name: Create an isolated acceptance database and install vector
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["AI_POSTGRES_DSN"], autocommit=True) as connection:
              connection.execute("CREATE DATABASE gaoji_acceptance")
          for name in ("AI_POSTGRES_DSN", "TEST_POSTGRES_DSN"):
              with psycopg.connect(os.environ[name]) as connection:
                  connection.execute("CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public")
          PY
      - name: Apply and verify Alembic schema
        run: |
          python -m src.bot_storage.cli upgrade
          python -m src.bot_storage.cli check
          AI_POSTGRES_DSN="$TEST_POSTGRES_DSN" python -m src.bot_storage.cli upgrade
          AI_POSTGRES_DSN="$TEST_POSTGRES_DSN" python -m src.bot_storage.cli check
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  windows-credentials:
    name: Windows credential ACL
    runs-on: windows-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check native Windows credential ACL and local handle rules
        run: python -m unittest -v tests.test_qq_official_windows_private

  nix:
    name: Nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check --no-build --print-build-logs
      - run: nix build .#packages.x86_64-linux.default --no-link --print-build-logs
      - run: nix build .#packages.x86_64-linux.host-control --no-link --print-build-logs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
