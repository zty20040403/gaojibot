name: Public search browser
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/search-browser.yml'
      - 'nix/module.nix'
      - 'nix/search-*'
      - 'src/plugins/ai_chat/sandbox_search.py'
      - 'tests/nix/public-search-browser.nix'
      - 'flake.*'
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build .#checks.x86_64-linux.public-search-browser --no-link --print-build-logs
