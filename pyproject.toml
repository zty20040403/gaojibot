[project]
name = "gaojibot"
version = "0.20.0"
description = "gaoji: a multi-model conversational agent with durable tools and cluster collaboration."
authors = [{name = "Kenneth"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "nonebot2[fastapi]>=2.4.0,<3.0.0",
  "nonebot-adapter-onebot>=2.4.6,<3.0.0",
  "openai>=1.0.0,<2.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "jsonschema>=4.23.0,<5.0.0",
  "blake3>=1.0.0,<2.0.0",
  "silk-python==0.2.8",
  "edge-tts==7.2.8",
  "miniaudio==1.71",
  "psycopg[binary,pool]>=3.2.0,<4.0.0",
  "SQLAlchemy>=2.0.0,<3.0.0",
  "alembic>=1.14.0,<2.0.0",
  "croniter>=6.0.0,<7.0.0",
  "playwright>=1.50.0,<2.0.0",
  "Pygments>=2.18.0,<3.0.0",
  "prometheus-client>=0.22.0,<1.0.0",
  "opentelemetry-api>=1.36.0,<2.0.0",
  "opentelemetry-sdk>=1.36.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.36.0,<2.0.0",
  "argon2-cffi>=25.1.0,<26.0.0",
]

[project.urls]
Homepage = "https://github.com/zty20040403/gaojibot"
Repository = "https://github.com/zty20040403/gaojibot"
Issues = "https://github.com/zty20040403/gaojibot/issues"

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.nonebot]
plugins = ["src.plugins.ai_chat"]
plugin_dirs = []
builtin_plugins = []
adapters = [
  { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
